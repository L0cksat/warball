<div class="wb-page">
  <h1 class="wb-title">Players — {{ (team$ | async)?.teamName }}</h1>
  <p class="wb-kicker">The lineup</p>

  <div class="wb-list">
    @for (player of (players$ | async) ?? []; track player.id) {
      <a class="wb-row" [routerLink]="['/teams', teamId, 'players', player.id, 'details']">
        <p>#{{ player.shirtNumber }} — {{ player.firstName }} {{ player.lastName }} — {{ player.position }}</p>
      </a>
    } @empty {
      <p class="wb-empty">There are no players on this team...</p>
    }
  </div>
</div>
