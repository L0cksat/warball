<div class="wb-page wb-admin">
  <p class="wb-admin-banner">Commissioner's office</p>
  <h1 class="wb-title">{{ teamId ? 'Edit team' : 'Create team' }}</h1>

  <form class="wb-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
      <label for="teamName">Team name</label>
      <input id="teamName" type="text" formControlName="teamName" />
    </div>

    <div>
      <label for="country">Country</label>
      <input id="country" type="text" formControlName="country" />
    </div>

    <div>
      <label for="province">Province</label>
      <input id="province" type="text" formControlName="province" />
    </div>

    <div>
      <label for="homePrimaryHex">Home primary color</label>
      <input id="homePrimaryHex" type="color" formControlName="homePrimaryHex" />
    </div>

    <div>
      <label for="homeSecondaryHex">Home secondary color</label>
      <input id="homeSecondaryHex" type="color" formControlName="homeSecondaryHex" />
    </div>

    <div>
      <label for="awayPrimaryHex">Away primary color</label>
      <input id="awayPrimaryHex" type="color" formControlName="awayPrimaryHex" />
    </div>

    <div>
      <label for="awaySecondaryHex">Away secondary color</label>
      <input id="awaySecondaryHex" type="color" formControlName="awaySecondaryHex" />
    </div>

    <div class="wb-form-actions">
      <button type="submit" class="wb-btn" [disabled]="form.invalid">Save</button>
      <a class="wb-btn wb-btn--danger" routerLink="/admin/teams">Cancel</a>
    </div>
  </form>
</div>
