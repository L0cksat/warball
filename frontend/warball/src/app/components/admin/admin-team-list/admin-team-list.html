<div class="wb-page wb-admin">
  <p class="wb-admin-banner">Commissioner's office</p>
  <h1 class="wb-title">Admin — Teams</h1>

  <div class="wb-actions">
    <a class="wb-btn" routerLink="/admin/teams/new">Add new team</a>
  </div>

  <div class="wb-list">
    @for (team of (teams$ | async) ?? []; track team.id) {
      <div class="wb-row">
        <p>{{ team.id }} — {{ team.teamName }} — {{ team.country }}</p>
        <div class="wb-actions">
          <a class="wb-btn wb-btn--ghost" [routerLink]="['/admin/teams', team.id, 'edit']">Edit team</a>
          <a class="wb-btn" [routerLink]="['/admin/teams', team.id, 'players']">Go to roster</a>
        </div>
      </div>
    } @empty {
      <p class="wb-empty">No teams yet.</p>
    }
  </div>
</div>
