<div class="wb-page wb-admin">
  <p class="wb-admin-banner">Commissioner's office</p>
  <h1 class="wb-title">{{ playerId ? 'Edit player' : 'Create player' }}</h1>

  <form class="wb-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
      <label for="playerId">Player ID</label>
      <input id="playerId" type="text" formControlName="playerId" />
    </div>

    <div>
      <label for="firstName">First name</label>
      <input id="firstName" type="text" formControlName="firstName" />
    </div>

    <div>
      <label for="lastName">Last name</label>
      <input id="lastName" type="text" formControlName="lastName" />
    </div>

    <div>
      <label for="race">Race</label>
      <input id="race" type="text" formControlName="race" />
    </div>

    <div>
      <label for="subRace">Sub race</label>
      <input id="subRace" type="text" formControlName="subRace" />
    </div>

    <div>
      <label for="age">Age</label>
      <input id="age" type="number" formControlName="age" />
    </div>

    <div>
      <label for="position">Position</label>
      <input id="position" type="text" formControlName="position" />
    </div>

    <div>
      <label for="hobbies">Hobbies</label>
      <input id="hobbies" type="text" formControlName="hobbies" />
    </div>

    <div>
      <label for="shirtNumber">Shirt number</label>
      <input id="shirtNumber" type="number" formControlName="shirtNumber" />
    </div>

    <div class="wb-form-actions">
      <button type="submit" class="wb-btn" [disabled]="form.invalid">Save</button>
      <a class="wb-btn wb-btn--danger" [routerLink]="['/admin/teams', teamId, 'players']">Cancel</a>
    </div>
  </form>
</div>
