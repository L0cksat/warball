
# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
spring.application.name=backend

# ===============================
# MYSQL CONFIGURATION (Relational)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3307/warball_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# MONGODB CONFIGURATION (Documents)
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/warball_live
# If you need authentication for Mongo later:
# spring.data.mongodb.uri=mongodb://username:password@localhost:27017/warball_live